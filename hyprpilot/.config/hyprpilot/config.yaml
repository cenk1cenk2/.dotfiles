---
logging:
  level: error

# Root-level [[patches]] — each entry is a partial ProfileConfig overlay
# folded onto whichever profile is picked at resolve time. Optional
# `$match.profile` glob filters which profiles a patch reaches (globset;
# crosses `/`). Bodies fold via the strategic `$patch` engine
# (`$patch: replace`, keyed-array merge by id, primitive append+dedupe,
# `$deleteFromPrimitiveList/<field>`).
patches:
  # Unscoped — every profile inherits the shared cwd, system_prompt and
  # default mcp/skills config.
  - system_prompt:
      - file: ~/.config/nvim/utils/agents/AGENTS.md
    mcp:
      enabled: true
      serve:
        enabled: true
      skills:
        enabled: true
      harness:
        enabled: true
      autoAcceptTools:
        - "*"
      autoRejectTools: []

  # personal/* + kilic/* profiles
  - $match:
      profile: "personal/*"
    harness:
      enabled: true
    mcp:
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-laravel"
              - "*-laravel-*"
              - notion-*
              - spacelift-*
    mcps:
      - file: ~/.config/nvim/utils/mcphub/servers.json
        ignore:
          - "*-laravel"
          - aws-docs
          - terraform

  # work/* profiles
  - $match:
      profile: "work/*"
    mcp:
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-kilic-*"
              - "*-kilic"
              - gitlab-*
    mcps:
      - file: ~/.config/nvim/utils/mcphub/servers.json
        ignore:
          - "*-kilic"
          - gitlab
          - playwright

  # Work Claude profiles point CLAUDE_CONFIG_DIR at the work config dir.
  - $match:
      profile: "work/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-laravel"

  # Personal Claude profiles point CLAUDE_CONFIG_DIR at the personal config dir.
  - $match:
      profile: "personal/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-kilic"

  # opencode has no single config-dir knob: OPENCODE_CONFIG_DIR only moves the
  # config, while sessions and credentials live in the sqlite file OPENCODE_DB
  # points at. Both are needed for the same isolation CLAUDE_CONFIG_DIR gives.
  # Note OPENCODE_CONFIG_DIR *overlays* rather than replaces — the stow package
  # deliberately ships no ~/.config/opencode/opencode.jsonc so there is nothing
  # underneath to leak across contexts.
  - $match:
      profile: "personal/kilic/*"
    env:
      "$patch": replace
      AI_KILIC_DEV_API_KEY: "${AI_KILIC_DEV_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-kilic"
      OPENCODE_DB: "${HOME}/.local/share/opencode-kilic/opencode.db"

  - $match:
      profile: "work/ollama/*"
    env:
      "$patch": replace
      LARAVEL_OLLAMA_API_KEY: "${LARAVEL_OLLAMA_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-laravel"
      OPENCODE_DB: "${HOME}/.local/share/opencode-laravel/opencode.db"

# [[agents]] — vendor registry. `command`/`args` are the NATIVE vendor
# CLI the launcher exec()s directly (no ACP bridge, no nested `spawn`).
# claude-code is inherited from the built-in defaults; these two override
# codex/opencode with the native flags you want.
agents:
  - id: codex
    provider: codex
    command: codex
    args:
      - "--profile"
      - "default"
  - id: opencode
    provider: opencode
    command: opencode
    args:
      - "--auto"

profile:
  default: personal/claude/opus

profiles:
  - id: personal/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: personal/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: personal/claude/sonnet
    agent: claude-code
    model: "sonnet"
    mode: auto

  - id: personal/claude/haiku
    agent: claude-code
    model: "haiku"
    mode: auto
    system_prompt: []

  # The AI_KILIC_DEV_API_KEY passthrough lives on the `personal/kilic/*` patch,
  # which folds onto these with `$patch: replace` and would clobber a per-profile
  # env block anyway.
  - id: personal/kilic/deepseek-v4-pro:cloud
    agent: opencode
    model: kilic/deepseek-v4-pro:cloud
    mode: build

  - id: personal/kilic/glm-5.2:cloud
    agent: opencode
    model: kilic/glm-5.2:cloud
    mode: build

  - id: personal/kilic/kimi-k3:cloud
    agent: opencode
    model: kilic/kimi-k3:cloud
    mode: build

  - id: personal/kilic/gemma4:31b-cloud
    agent: opencode
    model: kilic/gemma4:31b-cloud
    mode: build
    system_prompt: []

  - id: personal/codex/gpt-5.5
    agent: codex
    model: gpt-5.5
    mode: read-only

  - id: personal/codex/gpt-5.3-codex-spark
    agent: codex
    model: gpt-5.3-codex-spark
    mode: read-only

  - id: work/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: work/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: work/claude/sonnet
    agent: claude-code
    model: "sonnet[1m]"
    mode: auto

  - id: work/claude/haiku
    agent: claude-code
    model: haiku
    mode: auto
    system_prompt: []

  # Ollama Cloud direct — model ids carry no `:cloud` / `-cloud` suffix; that
  # tag only exists on the local-ollama-shaped API the kilic proxy fronts.
  - id: work/ollama/deepseek-v4-pro
    agent: opencode
    model: ollama/deepseek-v4-pro
    mode: build

  - id: work/ollama/glm-5.2
    agent: opencode
    model: ollama/glm-5.2
    mode: build

  # Re-enable alongside the matching `kimi-k3` entry in
  # `~/.config/opencode-laravel/opencode.jsonc` — a profile whose model is not
  # in the custom provider's `models` map resolves to nothing.
  # - id: work/ollama/kimi-k3
  #   agent: opencode
  #   model: ollama/kimi-k3
  #   mode: build

  - id: work/ollama/gemma4:31b
    agent: opencode
    model: ollama/gemma4:31b
    mode: build
    system_prompt: []
