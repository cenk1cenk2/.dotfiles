---
logging:
  level: error

# Partial ProfileConfig overlays folded onto the resolved profile.
# `$match.profile` is a globset and crosses `/`.
patches:
  - system_prompt:
      - file: ~/.config/nvim/utils/agents/AGENTS.md
    mcp:
      enabled: true
      serve:
        enabled: true
      skills:
        enabled: true
      harness:
        enabled: true
        mcp:
          harness:
            enabled: false
      autoAcceptTools:
        - "*"
      autoRejectTools: []

  - $match:
      profile: "personal/*"
    harness:
      enabled: true
    mcp:
      # `harness` above is the target side (may this profile be driven);
      # this is the launcher side (what may this session drive). Both must
      # pass, so the glob only narrows — it cannot nominate.
      harness:
        includeProfiles:
          - "personal/*"
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-laravel"
              - "*-laravel-*"
              - notion-*
              - spacelift-*
    mcps:
      - file: ~/.config/nvim/utils/agents/mcp/servers.json
        ignore:
          - "*-laravel"
          - aws-docs
          - terraform

  - $match:
      profile: "work/*"
    harness:
      enabled: true
    mcp:
      harness:
        includeProfiles:
          - "work/*"
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-kilic-*"
              - "*-kilic"
              - gitlab-*
    mcps:
      - file: ~/.config/nvim/utils/agents/mcp/servers.json
        ignore:
          - "*-kilic"
          - gitlab
          - playwright

  - $match:
      profile: "work/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-laravel"

  - $match:
      profile: "personal/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-kilic"

  # OPENCODE_CONFIG_DIR moves only the config; sessions and credentials live
  # in the sqlite file OPENCODE_DB points at. Both are needed.
  - $match:
      profile: "personal/kilic/*"
    env:
      "$patch": replace
      AI_KILIC_DEV_API_KEY: "${AI_KILIC_DEV_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-kilic"
      OPENCODE_DB: "${HOME}/.local/share/opencode-kilic/opencode.db"

  - $match:
      profile: "work/ollama/*"
    env:
      "$patch": replace
      LARAVEL_OLLAMA_API_KEY: "${LARAVEL_OLLAMA_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-laravel"
      OPENCODE_DB: "${HOME}/.local/share/opencode-laravel/opencode.db"

  # haiku + gemma drive one-shot text rewrites: no MCP, no shared prompt.
  # Has to live here rather than on the profiles — patches fold over profile
  # bodies, so the root patch above would win.
  - $match:
      profile: "*/haiku"
    mcp:
      enabled: false
    mcps:
      - "$patch": replace
    system_prompt:
      - "$patch": replace

  - $match:
      profile: "*/gemma4*"
    mcp:
      enabled: false
    mcps:
      - "$patch": replace
    system_prompt:
      - "$patch": replace

# Native vendor CLIs the launcher exec()s directly. claude-code comes from
# the built-in defaults.
agents:
  - id: codex
    provider: codex
    command: codex
    args:
      - "--profile"
      - "default"
  - id: opencode
    provider: opencode
    command: opencode
    args:
      - "--auto"

profile:
  default: personal/claude/opus

profiles:
  - id: personal/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: personal/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: personal/claude/sonnet
    agent: claude-code
    model: "sonnet"
    mode: auto

  # haiku + gemma drive one-shot text rewrites; the patch strips their MCP
  # and system prompt. Not `plan` — Claude Code's plan mode answers a rewrite
  # with planning commentary instead of the rewrite.
  - id: personal/claude/haiku
    agent: claude-code
    model: "haiku"
    mode: dontAsk
    system_prompt: []
    mcp:
      enabled: false

  # AI_KILIC_DEV_API_KEY comes from the `personal/kilic/*` patch, which
  # replaces any per-profile env block.
  - id: personal/kilic/deepseek-v4-pro:cloud
    agent: opencode
    model: kilic/deepseek-v4-pro:cloud
    mode: build

  - id: personal/kilic/glm-5.2:cloud
    agent: opencode
    model: kilic/glm-5.2:cloud
    mode: build

  - id: personal/kilic/kimi-k3:cloud
    agent: opencode
    model: kilic/kimi-k3:cloud
    mode: build

  - id: personal/kilic/gemma4:31b-cloud
    agent: opencode
    model: kilic/gemma4:31b-cloud
    mode: plan
    system_prompt: []
    mcp:
      enabled: false

  - id: personal/codex/gpt-5.6-sol
    agent: codex
    model: gpt-5.6-sol
    mode: read-only

  - id: personal/codex/gpt-5.6-terra
    agent: codex
    model: gpt-5.6-terra
    mode: read-only

  - id: personal/codex/gpt-5.6-luna
    agent: codex
    model: gpt-5.6-luna
    mode: read-only

  # Rejected by the API on a ChatGPT-account login.
  # - id: personal/codex/gpt-5.3-codex-spark
  #   agent: codex
  #   model: gpt-5.3-codex-spark
  #   mode: read-only

  - id: work/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: work/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: work/claude/sonnet
    agent: claude-code
    model: "sonnet[1m]"
    mode: auto

  - id: work/claude/haiku
    agent: claude-code
    model: haiku
    mode: dontAsk
    system_prompt: []
    mcp:
      enabled: false

  # Ollama Cloud model ids carry no `:cloud` suffix; that tag only exists on
  # the local-ollama-shaped API the kilic proxy fronts.
  - id: work/ollama/deepseek-v4-pro
    agent: opencode
    model: ollama/deepseek-v4-pro
    mode: build

  - id: work/ollama/glm-5.2
    agent: opencode
    model: ollama/glm-5.2
    mode: build

  # Needs the matching `kimi-k3` entry in opencode-laravel first.
  # - id: work/ollama/kimi-k3
  #   agent: opencode
  #   model: ollama/kimi-k3
  #   mode: build

  - id: work/ollama/gemma4:31b
    agent: opencode
    model: ollama/gemma4:31b
    mode: plan
    system_prompt: []
    mcp:
      enabled: false
