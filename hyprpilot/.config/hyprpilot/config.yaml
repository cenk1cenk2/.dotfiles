---
logging:
  level: error

# Partial ProfileConfig overlays folded onto the resolved profile.
# `$match.profile` is a globset and crosses `/`.
patches:
  - system_prompt:
      - file: ~/.config/nvim/utils/agents/AGENTS.md
    mcp:
      enabled: true
      serve:
        enabled: true
      skills:
        enabled: true
      harness:
        enabled: true
        mcp:
          harness:
            enabled: false
      autoAcceptTools:
        - "*"
      autoRejectTools: []

  - $match:
      profile: "personal/*"
    harness:
      enabled: true
    mcp:
      # `harness` above is the target side (may this profile be driven);
      # this is the launcher side (what may this session drive). Both must
      # pass, so the glob only narrows — it cannot nominate.
      harness:
        includeProfiles:
          - "personal/*"
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-laravel"
              - "*-laravel-*"
              - notion-*
              - spacelift-*
    mcps:
      - file: ~/.config/nvim/utils/agents/mcp/servers.json
      - file: ~/.config/nvim/utils/agents/mcp/personal.json

  - $match:
      profile: "work/*"
    harness:
      enabled: true
    mcp:
      harness:
        includeProfiles:
          - "work/*"
      skills:
        dirs:
          - dir: ~/.config/nvim/utils/agents/skills/
            ignore:
              - "*-kilic-*"
              - "*-kilic"
              - gitlab-*
    mcps:
      - file: ~/.config/nvim/utils/agents/mcp/servers.json
      - file: ~/.config/nvim/utils/agents/mcp/work.json

  - $match:
      profile: "work/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-laravel"

  - $match:
      profile: "personal/claude/*"
    env:
      "$patch": replace
      CLAUDE_CONFIG_DIR: "${HOME}/.claude-kilic"

  # OPENCODE_CONFIG_DIR moves only the config; sessions and credentials live
  # in the sqlite file OPENCODE_DB points at. Both are needed.
  - $match:
      profile: "personal/kilic/*"
    env:
      "$patch": replace
      AI_KILIC_DEV_API_KEY: "${AI_KILIC_DEV_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-kilic"
      OPENCODE_DB: "${HOME}/.local/share/opencode-kilic/opencode.db"

  - $match:
      profile: "work/ollama/*"
    env:
      "$patch": replace
      LARAVEL_OLLAMA_API_KEY: "${LARAVEL_OLLAMA_API_KEY}"
      OPENCODE_CONFIG_DIR: "${HOME}/.config/opencode-laravel"
      OPENCODE_DB: "${HOME}/.local/share/opencode-laravel/opencode.db"

  # haiku and gemma drive one-shot text rewrites: no MCP, no shared prompt. Has
  # to live here rather than on the profiles — patches fold over profile bodies,
  # so the root patch above would win.
  - $match:
      profile: "*/haiku"
    mcp:
      enabled: false
    mcps:
      - "$patch": replace
    system_prompt:
      - "$patch": replace

  - $match:
      profile: "*/gemma4*"
    mcp:
      enabled: false
    mcps:
      - "$patch": replace
    system_prompt:
      - "$patch": replace

  # The cheap tier drives one-shot text rewrites (worktrunk commit messages),
  # so it gets the same treatment: no MCP, no shared prompt. The other kilic.dev
  # tiers stay full agents.
  - $match:
      profile: "personal/kilic/cheap"
    mcp:
      enabled: false
    mcps:
      - "$patch": replace
    system_prompt:
      - "$patch": replace

# Native vendor CLIs the launcher exec()s directly. claude-code comes from
# the built-in defaults.
agents:
  - id: codex
    provider: codex
    command: codex
    # `--approve-for-me` selects workspace-write; explicit `mode` conflicts.
    args:
      - "--profile"
      - "default"
      - "--approve-for-me"
  - id: opencode
    provider: opencode
    command: opencode
    args:
      - "--auto"

profile:
  default: personal/claude/opus

profiles:
  - id: personal/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: personal/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: personal/claude/sonnet
    agent: claude-code
    model: "sonnet"
    mode: auto

  # haiku + gemma drive one-shot text rewrites; the patch strips their MCP
  # and system prompt. Not `plan` — Claude Code's plan mode answers a rewrite
  # with planning commentary instead of the rewrite.
  - id: personal/claude/haiku
    agent: claude-code
    model: "haiku"
    mode: dontAsk
    system_prompt: []
    mcp:
      enabled: false

  # AI_KILIC_DEV_API_KEY comes from the `personal/kilic/*` patch, which
  # replaces any per-profile env block.
  - id: personal/kilic/deepseek-v4-pro:cloud
    agent: opencode
    model: kilic/ollama/cloud/deepseek-v4-pro:cloud
    mode: build

  - id: personal/kilic/glm-5.2:cloud
    agent: opencode
    model: kilic/ollama/cloud/glm-5.2:cloud
    mode: build

  - id: personal/kilic/glm-5.3-flash:cloud
    agent: opencode
    model: kilic/ollama/cloud/glm-5.3-flash:cloud
    mode: build

  - id: personal/kilic/kimi-k3:cloud
    agent: opencode
    model: kilic/ollama/cloud/kimi-k3:cloud
    mode: build

  - id: personal/kilic/gemma4:31b-cloud
    agent: opencode
    model: kilic/ollama/cloud/gemma4:31b-cloud
    mode: plan
    system_prompt: []
    mcp:
      enabled: false

  # kilic.dev/* are agentgateway virtual models, each failing over across zai,
  # ollama-cloud, codex and ollama-neutrino. Pinning a tier survives a single
  # backing model's quota, which pinning a concrete model above does not.
  # Named under `personal/kilic/` so the patch there supplies the API key and
  # the opencode config dir.
  - id: personal/kilic/cheap
    agent: opencode
    model: kilic/kilic.dev/cheap
    mode: plan

  - id: personal/kilic/default
    agent: opencode
    model: kilic/kilic.dev/default
    mode: build

  - id: personal/kilic/smart
    agent: opencode
    model: kilic/kilic.dev/smart
    mode: build

  - id: personal/kilic/max
    agent: opencode
    model: kilic/kilic.dev/max
    mode: build

  - id: personal/kilic/vision
    agent: opencode
    model: kilic/kilic.dev/vision
    mode: plan

  - id: personal/codex/gpt-5.6-sol
    agent: codex
    model: gpt-5.6-sol
    # mode: workspace-write

  - id: personal/codex/gpt-5.6-terra
    agent: codex
    model: gpt-5.6-terra
    # mode: workspace-write

  - id: personal/codex/gpt-5.6-luna
    agent: codex
    model: gpt-5.6-luna
    # mode: workspace-write

  # Rejected by the API on a ChatGPT-account login.
  # - id: personal/codex/gpt-5.3-codex-spark
  #   agent: codex
  #   model: gpt-5.3-codex-spark
  #   mode: read-only

  - id: work/claude/fable
    agent: claude-code
    model: "claude-fable-5[1m]"
    mode: auto

  - id: work/claude/opus
    agent: claude-code
    model: "opus[1m]"
    mode: auto

  - id: work/claude/sonnet
    agent: claude-code
    model: "sonnet[1m]"
    mode: auto

  - id: work/claude/haiku
    agent: claude-code
    model: haiku
    mode: dontAsk
    system_prompt: []
    mcp:
      enabled: false

  # Ollama Cloud accepts the tagged and untagged spelling of the same id, so
  # these stay untagged while the kilic ones keep their `:cloud` tag.
  - id: work/ollama/deepseek-v4-pro
    agent: opencode
    model: ollama/deepseek-v4-pro
    mode: build

  - id: work/ollama/glm-5.2
    agent: opencode
    model: ollama/glm-5.2
    mode: build

  - id: work/ollama/glm-5.3-flash
    agent: opencode
    model: ollama/glm-5.3-flash
    mode: build

  - id: work/ollama/kimi-k3
    agent: opencode
    model: ollama/kimi-k3
    mode: build

  - id: work/ollama/gemma4:31b
    agent: opencode
    model: ollama/gemma4:31b
    mode: plan
    system_prompt: []
    mcp:
      enabled: false
