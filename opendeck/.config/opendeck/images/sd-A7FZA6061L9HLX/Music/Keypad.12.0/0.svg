
			<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

			<defs>
				<pattern id="iconPattern" patternUnits="userSpaceOnUse" width="120" height="120">
					<image href="data:image/jpeg;base64," x="0" y="0" width="120" height="120"/>
				</pattern>

				<filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
					<feGaussianBlur in="SourceAlpha" stdDeviation="0" result="blur"/>
					<feComposite in="SourceAlpha" in2="blur" operator="out" result="innerEdge"/>
					<feFlood flood-color="#null" flood-opacity="1" result="glowColor"/>
					<feComposite in="glowColor" in2="innerEdge" operator="in" result="coloredGlow"/>
					<feComposite in="coloredGlow" in2="coloredGlow" operator="over"/>
				</filter>
			</defs>

			<rect width="120" height="120" fill="url(#iconPattern)"/>

			
			
			
			<path d="M 65,29 C 59,19 49,12 37,12 20,12 7,25 7,42 7,75 25,80 65,118 105,80 123,75 123,42 123,25 110,12 93,12 81,12 71,19 65,29 z"
				fill="#1db954" stroke="#191414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
				transform="translate(19.655172413793103, 19.655172413793103) scale(0.6206896551724138)"
				vector-effect="non-scaling-stroke"/>
		
			</svg>
		