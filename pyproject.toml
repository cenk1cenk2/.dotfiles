[tool.pyright]
include = ["."]
# dotlib is installed only into the deployed venvs, so a checkout has no other
# way to resolve `from dotlib...`. Repo-relative, unlike the uv path deps in
# each scripts project, which are relative to their DEPLOYED location.
extraPaths = ["wayland/.config/wayland/lib/src"]
exclude = ["**/node_modules", "**/__pycache__"]

reportOptionalMemberAccess = false

[project]
requires-python = ">= 3.14"
name = "dotfiles"
version = "1.0.0"
# No dependencies: this project exists to anchor pyright over the repo, and
# the only files it covers (install.py, neomutt/) are stdlib-only. Every
# third-party import belongs to a scripts project that declares it itself.
dependencies = []
