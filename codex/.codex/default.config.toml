#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.5"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

personality = "pragmatic"
web_search = "cached"

project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]

[history]
persistence = "save-all"

[memories]
use_memories = true
generate_memories = true

[terminal]
newline = "ctrl_m"

[features]
use_linux_sandbox_bwrap = true
multi_agent = true
apps = true
terminal_resize_reflow = true
memories = true
remote_control = true

[tui]
notifications = true
notification_method = "bel"
notification_condition = "always"
show_tooltips = false

# Desktop notifications alongside the bell above. `notification_method` is a
# single-value enum (auto/osc9/bel), so bel and a native notification cannot
# both come from [tui] — hooks are independent of it and stack on top.
# Hooks run with the session cwd as their working directory and take the event
# JSON on stdin. Codex requires trusting each hook definition once (`/hooks`);
# editing a command changes its hash and re-triggers the review.

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = '''jq -r '.tool_name // "a tool"' | { read -r t; notify-send -a "Codex" -i utilities-terminal -u normal "Codex — ${PWD##*/}" "Needs approval to run $t"; } 2>/dev/null || true'''
async = true
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '''cat >/dev/null 2>&1; notify-send -a "Codex" -i utilities-terminal -u normal "Codex — ${PWD##*/}" "Turn finished" 2>/dev/null || true'''
async = true
timeout = 5

status_line = [
  "model-with-reasoning",
  "run-state",
  "permissions",
  "approval-mode",
  "five-hour-limit",
  "weekly-limit",
  "project-name",
  "git-branch",
  "branch-changes",
  "pull-request-number",
  "context-used",
]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
hide_full_access_warning = true
