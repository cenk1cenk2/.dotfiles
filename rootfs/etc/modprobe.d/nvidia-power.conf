# 0x02 forces fine-grained RTD3. 0x03 leaves it to a per-chip heuristic that
# silently falls back to no runtime PM. 0x03 additionally calls
# nv_allow_runtime_suspend(); that is pm_runtime_allow(), which the
# power/control="auto" rule in 80-nvidia-pm.rules does — keep the two together.
options nvidia NVreg_DynamicPowerManagement=0x02
options nvidia NVreg_EnableS0ixPowerManagement=1

# DynamicPowerManagementVideoMemoryThreshold is a cap in MB on GCOFF (full
# power-off with video memory dropped): RM always holds ~2MiB, so 0 rules GCOFF
# out and the GPU idles in GC6 instead, D3cold with video memory in
# self-refresh. That is the workaround in open-gpu-kernel-modules#905 for the
# GPU waking straight back up after GCOFF.
options nvidia NVreg_DynamicPowerManagementVideoMemoryThreshold=0

# Skips zeroing system memory before the GPU gets it: faster, but freed page
# contents stay visible to GPU clients.
options nvidia NVreg_InitializeSystemMemoryAllocations=0
