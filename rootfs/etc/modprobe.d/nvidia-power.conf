# 0x03 (DEFAULT) is the driver default, pinned because it is the only value
# that takes the nv_allow_runtime_suspend() path — an explicit 0x02 (FINE)
# skips it (dynamic-power.c gates on regkey == DEFAULT, not on mode).
options nvidia NVreg_DynamicPowerManagement=0x03
options nvidia NVreg_EnableS0ixPowerManagement=1
# DynamicPowerManagementVideoMemoryThreshold stays at its default (200MB):
# GCOFF requires usedFbSize <= threshold, so 0 means "never fully power off
# once any vidmem is allocated" — it is a cap, not a disable-the-cap.
