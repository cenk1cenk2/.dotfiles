---
# https://taskfile.dev

version: "3"

vars:
  to: "~"
  args: ""
  verbosity: '{{ repeat (.LOG_LEVEL | default 1 | int) "v" }}'

tasks:
  check:
    desc: Diff every system-installed file against the repo, changing nothing.
    cmds:
      - ./install.py --dry-run

  plan:
    label: "plan: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Dry-run named packages, e.g. `task plan -- kitty waybar`.
    cmds:
      - stow {{ .args }} --no-folding -n{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}

  deploy:
    desc: Deploy to a target.
    label: "deploy: {{ .to }} -> {{ .CLI_ARGS }}"
    cmds:
      - stow {{ .args }} --no-folding -{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}
    status:
      - '{{ .status | default "false" }}'

  undeploy:
    label: "undeploy: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Remove a stowed target.
    cmds:
      - stow {{ .args }} -{{ .verbosity }}t {{ .to }} -D {{ .packages }} {{ .CLI_ARGS }}
    status:
      - '{{ .status | default "false" }}'

  deploy:run:
    desc: Deploys to all targets
    deps:
      - task: deploy:linux

  deploy:linux:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy:linux:user
      - task: deploy:linux:system

  deploy:linux:user:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy
        vars:
          to: "~"
          packages: >-
            brave
            claude
            clipse
            codex
            dbus
            desktop
            easyeffects
            electron
            enchant
            fonts
            gitconfig
            gnupg
            gtk
            hyprland
            hyprpilot
            input-remapper
            kanshi
            khal
            kitty
            mangohud
            mimetypes
            mpv
            neomutt
            obsbot
            opencode
            pacman
            pimsync
            pipewire
            rofi
            scripts
            spotify
            ssh-config
            swappy
            swayimg
            swaync
            swayosd
            uwsm
            waybar
            wayland
            wayland-pipewire-idle-inhibit
            wayland-theme
            wiremix
            wireplumber
            wlogout
            xauthority
            xdg-desktop-portal
            xdg-desktop-portal-termfilechooser
            xsettingsd
            ydotool
            zathura
      - systemctl --user daemon-reload
      - systemctl --user enable --now --no-block wayland-theme.service xsettingsd.service waybar@hyprland.service

  deploy:linux:system:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - ./install.py
      - sudo systemctl daemon-reload
      - sudo udevadm control --reload
      - sudo sysctl --system
