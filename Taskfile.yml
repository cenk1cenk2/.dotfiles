---
# https://taskfile.dev

version: "3"

env: {}

vars:
  to: "~"
  args: ""
  sudo: false
  verbosity: '{{ repeat (.LOG_LEVEL | default 1 | int) "v" }}'

tasks:
  check:
    desc: Report the planned system installs and verify stow coverage.
    cmds:
      - ./install.py check

  plan:
    label: "plan: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Plan to target.
    cmds:
      - stow --no-folding -n{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}

  deploy:
    desc: Deploy to a target.
    label: "deploy: {{ .to }} -> {{ .CLI_ARGS }}"
    cmds:
      # - task: plan
      #   vars:
      #     CLI_ARGS: '{{ .CLI_ARGS }}'
      #     to: '{{ .to }}'
      - "{{ if .sudo }}sudo {{ end }}stow {{ .args }} --no-folding -{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}"
    status:
      - '{{ .status | default "false" }}'

  undeploy:
    label: "undeploy: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Remove a stowed target.
    cmds:
      - stow {{ .args }} -{{ .verbosity }}t {{ .to }} -D {{ .packages }} {{ .CLI_ARGS }}
    status:
      - '{{ .status | default "false" }}'

  deploy:run:
    desc: Deploys to all targets
    deps:
      - task: deploy:linux

  deploy:linux:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy:linux:user
      - task: deploy:linux:system

  deploy:linux:user:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy
        vars:
          to: "~"
          packages: >-
            autotiling-rs
            brave
            claude
            clipse
            codex
            dbus
            desktop
            easyeffects
            electron
            enchant
            fonts
            gitconfig
            gnupg
            gtk
            hyprland
            hyprpilot
            hyprwhspr
            input-remapper
            kanshi
            khal
            kitty
            mako
            mangohud
            mimetypes
            mpv
            neomutt
            obsbot
            opencode
            pacman
            pimsync
            pipewire
            rofi
            scripts
            ssh-config
            swappy
            sway
            swayidle
            swayimg
            swaylock
            swaync
            swayosd
            swayr
            sworkstyle
            uwsm
            waybar
            wayland
            wayland-pipewire-idle-inhibit
            wayland-theme
            wiremix
            wireplumber
            wl-gamma-relay-rs
            wlogout
            xauthority
            xdg-desktop-portal
            xdg-desktop-portal-termfilechooser
            xsettingsd
            ydotool
            zathura
          # args: --adopt
      # HACK: little trick to change the configuration for nvidia
      # - task: deploy
      #   vars:
      #     to: "~"
      #     packages: brave electron
      #     # status: '! [[ "$LIBVA_DRIVER_NAME" != "nvidia" ]]'
      #     status: test -d /usr/lib/nvidia
      # - task: deploy
      #   vars:
      #     to: "~"
      #     packages: brave-nvidia electron-nvidia
      #     # status: '! [[ "$LIBVA_DRIVER_NAME" == "nvidia" ]]'
      #     status: test ! -d /usr/lib/nvidia
      # HACK: little trick to change the configuration for nvidia
      # TODO: remove after deploying to all instances
      - task: undeploy
        vars:
          to: "~"
          packages: >-
            chrome
            dex
          # args: --adopt
          #
      - systemctl --user daemon-reload
      - systemctl --user enable --now --no-block wayland-theme.service xsettingsd.service waybar@hyprland.service waybar@sway.service

  deploy:linux:system:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy
        vars:
          sudo: true
          to: "/"
          packages: rootfs
          # args: --adopt
      - ./install.py system
