---
# https://taskfile.dev

version: "3"

env: {}

vars:
  to: "~"
  args: ""
  sudo: false
  verbosity: '{{ repeat (.LOG_LEVEL | default 1 | int) "v" }}'

tasks:
  install:
    desc: Install necessary dependencies.
    deps:
      - wayland-scripts:bootstrap

  plan:
    label: "plan: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Plan to target.
    cmds:
      - stow --no-folding -n{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}

  deploy:
    desc: Deploy to a target.
    label: "deploy: {{ .to }} -> {{ .CLI_ARGS }}"
    cmds:
      # - task: plan
      #   vars:
      #     CLI_ARGS: '{{ .CLI_ARGS }}'
      #     to: '{{ .to }}'
      - "{{ if .sudo }}sudo {{ end }}stow {{ .args }} --no-folding -{{ .verbosity }}t {{ .to }} {{ .packages }} {{ .CLI_ARGS }}"
    status:
      - '{{ .status | default "false" }}'

  undeploy:
    label: "undeploy: {{ .to }} -> {{ .CLI_ARGS }}"
    desc: Remove a stowed target.
    cmds:
      - stow {{ .args }} -{{ .verbosity }}t {{ .to }} -D {{ .packages }} {{ .CLI_ARGS }}
    status:
      - '{{ .status | default "false" }}'

  deploy:run:
    desc: Deploys to all targets
    deps:
      - task: deploy:linux

  wayland-scripts:bootstrap:
    desc: >-
      Provision the uv venv at the stow destination so `uv run` from
      the wayland scripts' shebangs finds a prepared env. `pyproject.toml`
      and `uv.lock` are symlinked from this repo (via the `wayland` stow
      package) so dependency changes still commit through git; only the
      generated `.venv/` stays local to the target machine.
    dir: "{{ .HOME }}/.config/wayland/scripts"
    cmds:
      - uv sync

  deploy:linux:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy:linux:user
      - task: deploy:linux:system

  deploy:linux:user:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy
        vars:
          to: "~"
          packages: >-
            autotiling-rs
            brave
            claude
            clipse
            codex
            dbus
            desktop
            easyeffects
            electron
            enchant
            fonts
            gitconfig
            gnupg
            gtk
            hyprland
            hyprpilot
            hyprwhspr
            input-remapper
            kanshi
            khal
            kitty
            mako
            mangohud
            mimetypes
            mpv
            neomutt
            obsbot
            opencode
            pacman
            pimsync
            pipewire
            rofi
            scripts
            ssh-config
            swappy
            sway
            swayidle
            swayimg
            swaylock
            swaync
            swayosd
            swayr
            sworkstyle
            uwsm
            waybar
            wayland
            wayland-pipewire-idle-inhibit
            wayland-theme
            wiremix
            wireplumber
            wl-gamma-relay-rs
            wlogout
            xauthority
            xdg-desktop-portal
            xdg-desktop-portal-termfilechooser
            xsettingsd
            ydotool
            zathura
          # args: --adopt
      # HACK: little trick to change the configuration for nvidia
      # - task: deploy
      #   vars:
      #     to: "~"
      #     packages: brave electron
      #     # status: '! [[ "$LIBVA_DRIVER_NAME" != "nvidia" ]]'
      #     status: test -d /usr/lib/nvidia
      # - task: deploy
      #   vars:
      #     to: "~"
      #     packages: brave-nvidia electron-nvidia
      #     # status: '! [[ "$LIBVA_DRIVER_NAME" == "nvidia" ]]'
      #     status: test ! -d /usr/lib/nvidia
      # HACK: little trick to change the configuration for nvidia
      # TODO: remove after deploying to all instances
      - task: undeploy
        vars:
          to: "~"
          packages: >-
            chrome
            dex
          # args: --adopt
          #
      - systemctl --user daemon-reload
      - systemctl --user enable --now --no-block wayland-theme.service xsettingsd.service waybar@hyprland.service waybar@sway.service

  deploy:linux:system:
    desc: Deploy to target.
    platforms:
      - linux
    cmds:
      - task: deploy
        vars:
          sudo: true
          to: "/"
          packages: rootfs
          # args: --adopt
      - sudo install -d -m 0755 /usr/local/share/wayland-sessions
      - sudo install -m 0644 rootfs/usr/local/share/wayland-sessions/*.desktop /usr/local/share/wayland-sessions/
      - sudo install -d -m 0755 /etc/modprobe.d
      - sudo install -m 0644 rootfs/etc/modprobe.d/*.conf /etc/modprobe.d/
      - sudo install -d -m 0755 /etc/geoclue/conf.d /etc/NetworkManager/dispatcher.d
      - sudo install -m 0644 geoclue/etc/geoclue/conf.d/*.conf /etc/geoclue/conf.d/
      - sudo install -m 0644 geoclue/etc/systemd/system/* /etc/systemd/system/
      - sudo install -m 0755 geoclue/etc/NetworkManager/dispatcher.d/09-timezone /etc/NetworkManager/dispatcher.d/
      - sudo install -m 0755 geoclue/usr/local/bin/geo-timezone /usr/local/bin/
      - sudo systemctl daemon-reload
