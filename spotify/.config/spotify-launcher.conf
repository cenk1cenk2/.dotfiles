# spotify-launcher forwards these to the bundled spotify binary, which is CEF
# (Chromium 146), not the Arch electron package -- so ../electron-flags.conf
# never reached it. Verified against libcef.so: --ozone-platform-hint and
# --force-dark-mode do not exist in this build, hence the explicit platform.
#
# This file REPLACES /etc/spotify-launcher.conf rather than merging with it;
# the packaged one is comments only. Inspect the assembled command with
# `spotify-launcher -v --skip-update --no-exec`.
[spotify]
extra_arguments = [
  "--ozone-platform=wayland",
  "--enable-gpu-rasterization",
  "--enable-features=AcceleratedVideoDecodeLinuxGL,CanvasOopRasterization",
  # Rendering uses GL/ANGLE; spotify bundles its own libvulkan.so.1 whose
  # device probe loads the NVIDIA ICD and pins the dGPU awake on hybrid.
  "--disable-features=Vulkan",
  "--enable-wayland-ime",
]
# MangoHud injects into spotify and loads libnvidia-ml for its NVML readout,
# which holds /dev/nvidia0 open for the process lifetime. Nothing here wants
# an FPS overlay. Use `MANGOHUD=1 %command%` on the Steam titles that do.
extra_env_vars = ["MANGOHUD=0"]
