# hyprlock 0.9 — colours are the nvim onedarker palette, as in
# wayland/.config/wayland/theme.css.

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# A lid close suspends ~10ms after the session locks, and after resume the
# lock surface gets no new frames until something forces one. A fade-in is
# frozen on its first, nearly transparent frame (the "weak blur"), and a
# fade-out holds the unlock back until frames resume. Both fades stay off.
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldFade, 1, 3, ease
}

background {
    monitor =
    path = screenshot
    color = rgb(17191e)
    blur_passes = 4
    blur_size = 10
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = Segoe UI Light
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(151, 158, 171, 1.0)
    font_size = 18
    font_family = Segoe UI
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 16
    font_family = Segoe UI Semibold
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(4b5263)
    inner_color = rgba(23, 25, 30, 0.85)
    font_color = rgb(ffffff)
    font_family = Segoe UI
    check_color = rgb(e5c07b)
    fail_color = rgb(e06c75)
    capslock_color = rgb(e5c07b)
    numlock_color = -1
    bothlock_color = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##979eab">Password</span>
    fail_text = <span foreground="##ffffff">$FAIL ($ATTEMPTS)</span>
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(151, 158, 171, 1.0)
    font_size = 12
    font_family = Segoe UI
    position = 0, 40
    halign = center
    valign = bottom
}
