general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 900
    on-timeout = upower -i $(upower -e | grep battery) | grep -q "state.*discharging" && brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = upower -i $(upower -e | grep battery) | grep -q "state.*discharging" && (pidof hyprlock || hyprlock) && playerctl -a pause
}

# Hard stop: pause all media after 1h idle regardless of power state or
# host (blacklisted players like Spotify keep the machine awake otherwise).
listener {
    timeout = 3600
    on-timeout = playerctl -a pause
}

# All hosts: blank every output after 1h idle. No on-resume:
# mouse_move/key_press_enables_dpms already light every output on input,
# and an on-resume here would also relight outputs blanked by hand.
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
}

# OLED hosts: fully blank at 5 min idle (charging or not) to spare the
# panel. Gated by hostname regex — add more hosts to the alternation as
# they land. mouse_move/key_press_enables_dpms wake it on input.
#
# Both lines carry the gate: hypridle fires on-resume for any listener
# whose timeout elapsed, whether or not on-timeout did anything, so an
# ungated on-resume dispatches dpms("on") on every host — flipping back
# on outputs that were blanked by hand.
#
# Scoped to the internal panel so a docked bat keeps its externals lit.
# The table form is the only one that takes a monitor: the string form
# ignores any name appended to it ('off DP-2' blanks every output), and
# there is no 'monitor' second argument. Output name is read at runtime
# rather than hardcoded, so eDP-1 vs eDP-2 does not matter.
listener {
    timeout = 300
    on-timeout = uname -n | grep -qE '^(bat)$' && m=$(hyprctl monitors | awk '/^Monitor eDP/ {print $2; exit}') && [ -n "$m" ] && hyprctl dispatch "hl.dsp.dpms({action=\"off\", monitor=\"$m\"})"
    on-resume = uname -n | grep -qE '^(bat)$' && m=$(hyprctl monitors | awk '/^Monitor eDP/ {print $2; exit}') && [ -n "$m" ] && hyprctl dispatch "hl.dsp.dpms({action=\"on\", monitor=\"$m\"})"
}
