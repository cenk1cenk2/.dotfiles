# Dependency manifest for the wayland/scripts package.
#
# Runtime model: each executable script (copywriter.py, recorder.py,
# speech.py) shebangs to a small `sh -c` trampoline so invocation works
# from any CWD (compositor keybinds don't cd into the scripts dir before
# spawning):
#
#     #!/usr/bin/env -S sh -c 'd="$(dirname "$0")"; uv sync -q --project "$d" && exec "$d/.venv/bin/python" "$0" "$@"'
#
# `$0` is the script path the kernel hands us at shebang-time, so
# `$(dirname "$0")` resolves to whichever directory the script is
# actually sitting in (stow destination when invoked through the
# symlink, dotfiles repo when running directly). No hardcoded `$HOME` —
# the path travels with the script.
#
# `uv sync` locks and creates or updates `.venv/` against the dependency
# set below, then `exec` replaces the shell with the venv's Python, so no
# uv process stays resident behind a long-running script. No `.venv/`
# commits go into git: the first invocation of any script creates it.
# There is no bootstrap task.
#
# PEP 723 inline metadata was ruled out: `uv run --script` deliberately
# ignores the project's dependency set (see
# https://docs.astral.sh/uv/guides/scripts/#using-a-shebang-to-create-an-executable-file),
# which would force us to copy the dep list into every entry script.

[project]
name = "wayland-scripts"
version = "0.1.0"
description = "Speech capture, recorder and copywriter glue for the Wayland dotfiles."
requires-python = ">=3.14"
dependencies = [
  "dotlib",
  # CLI parsing + styled logging (stderr only).
  "click>=8.1",
  "rich>=13.7",
  # Singleton detection + waybar process chatter.
  "psutil>=7.0",
  # obs-websocket bindings for recorder.py.
  "obsws-python>=1.8",
  # The realtime transcription socket. The stdlib has no WebSocket client,
  # and the endpoint speaks nothing else.
  "websocket-client>=1.8",
]

[tool.ty.environment]
extra-paths = [".", "../lib/src"]

[tool.pyright]
extraPaths = [".", "../lib/src"]

[tool.uv.sources]
# Relative to this file's DEPLOYED location, not the repo: uv resolves a path
# dependency against the directory holding the pyproject it reads, and stow
# deploys this file as a symlink. A repo-relative path resolves to nothing.
dotlib = { path = "../lib", editable = true }
