# Google calendars are pulled through their "Secret address in iCal format",
# which is a bearer credential: whoever holds the URL reads every event. The
# URLs therefore live in ./urls/ on the machine and are never tracked here.
#
# Webcal is read-only, so the pairs are one-way (a -> b) and khal marks both
# calendars readonly. Events created locally would be deleted on the next sync.

status_path "~/.local/share/pimsync/status/"

storage calendars_local {
	type vdir/icalendar
	path ~/.calendars/
	fileext ics
}

storage calendars_personal {
	type webcal
	collection_id personal
	url {
		shell cat ~/.config/pimsync/urls/personal
	}
	interval 900
}

storage calendars_laravel {
	type webcal
	collection_id laravel
	url {
		shell cat ~/.config/pimsync/urls/laravel
	}
	interval 900
}

# Pair names match the url filenames: the service starts only the pairs whose
# url file exists, so a calendar without a url is skipped instead of failing
# the whole config.

pair personal {
	storage_a calendars_personal
	storage_b calendars_local
	collection personal
	one_way
}

pair laravel {
	storage_a calendars_laravel
	storage_b calendars_local
	collection laravel
	one_way
}
